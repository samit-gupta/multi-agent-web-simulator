<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Scalable Multi-Agent Path Planning Simulator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Scalable Multi-Agent Path Planning Simulator</h1>

    <div class="controls">
        <button id="startBtn">Start Simulation</button>
        <button id="resetBtn">Reset</button>

        <!-- Algorithm Selector -->
        <label style="margin-left: 20px;">
            Algorithm:
            <select id="algoSelect">
                <option value="BFS">BFS</option>
                <option value="A_STAR">A*</option>
            </select>
        </label>

        <!-- Agent Count Selector -->
        <label style="margin-left: 20px;">
            Agents:
            <input type="range" id="agentCount" min="1" max="10" value="2">
            <span id="agentCountLabel">2</span>
        </label>
    </div>

    <div id="grid"></div>

    <!-- Robot Selector -->
    <div id="robotSelector" class="selector hidden">
        <p>Send which robot?</p>
        <div id="robotButtons"></div>
    </div>


    <!-- Metrics Panel -->
    <div id="metrics" class="metrics hidden">
        <h3>Performance Metrics</h3>
        <table>
            <thead>
                <tr>
                    <th>Agent</th>
                    <th>Algorithm</th>
                    <th>Path Length</th>
                    <th>Nodes Visited</th>
                    <th>Time (ms)</th>
                </tr>
            </thead>
            <tbody id="metricsBody"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
