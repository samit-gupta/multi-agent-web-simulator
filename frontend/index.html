<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Multi-Agent Coordination Simulator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Multi-Agent Coordination Simulator</h1>

    <div class="controls">
        <button id="startBtn">Start Simulation</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div id="grid"></div>

    <!-- Robot Selector -->
    <div id="robotSelector" class="selector hidden">
        <p>Send which robot?</p>
        <button data-robot="1">Robot 1</button>
        <button data-robot="2">Robot 2</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
